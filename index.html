<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領収書スキャナー</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.4em; }
  .drop-area { border: 2px dashed #aaa; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; background: #f9f9f9; }
  .drop-area.dragover { background: #e8f0fe; border-color: #4285f4; }
  img#preview { max-width: 100%; margin-top: 16px; border-radius: 8px; display: none; }
  button { margin-top: 16px; width: 100%; padding: 14px; font-size: 1em; background: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #aaa; }
  #result { margin-top: 24px; background: #f1f8e9; border-radius: 8px; padding: 16px; display: none; }
  #error { margin-top: 16px; color: red; display: none; }
</style>
</head>
<body>
<h1>領収書スキャナー</h1>

<div class="drop-area" id="dropArea">
  📷 画像をここにドロップ、またはクリックして選択
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" style="display:none">
</div>
<p><label>利用パスワード <input type="password" id="accessPassword" autocomplete="off"></label></p>
<p>JPEG・PNG・WebP画像（3MB以下）</p>
<img id="preview" alt="領収書">
<button id="submitBtn" disabled>スプレッドシートに記録する</button>
<div id="error"></div>
<div id="result"></div>

<script>

  let base64Data = '';

  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const preview   = document.getElementById('preview');
  const submitBtn = document.getElementById('submitBtn');
  const resultDiv = document.getElementById('result');
  const errorDiv  = document.getElementById('error');

  dropArea.addEventListener('click', () => fileInput.click());
  dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
  dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
  dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

  function loadFile(file) {
    if (!file) return;
    base64Data = '';
    submitBtn.disabled = true;
    preview.style.display = 'none';
    if (!['image/jpeg','image/png','image/webp'].includes(file.type) || file.size > 3 * 1024 * 1024) {
      errorDiv.textContent = 'JPEG・PNG・WebP形式の3MB以下の画像を選んでください。';
      errorDiv.style.display = 'block';
      return;
    }
    errorDiv.style.display = 'none';
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      base64Data = dataUrl.split(',')[1];
      preview.src = dataUrl;
      preview.style.display = 'block';
      submitBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  }

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true;
    submitBtn.textContent = '処理中...';
    resultDiv.style.display = 'none';
    errorDiv.style.display = 'none';

    try {
      const res = await fetch('/api/receipt', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + document.getElementById('accessPassword').value,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          input_base64: base64Data
        })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      const raw = data.result?.output ?? data.result ?? {};
      const content = typeof raw === 'string' ? JSON.parse(raw) : raw;

      resultDiv.style.display = 'block';
      resultDiv.replaceChildren();
      for (const text of ['✅ 記録しました！', '店舗名：' + (content.店舗名 ?? '-'), '日付：' + (content.日付 ?? '-'), '費目：' + (content.費目 ?? '-'), '商品数：' + (Array.isArray(content.商品リスト) ? content.商品リスト.length : 0)]) {
        const row = document.createElement('p');
        row.textContent = text;
        resultDiv.append(row);
      }
    } catch (e) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'エラー: ' + e.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'スプレッドシートに記録する';
    }
  });
</script>
</body>
</html>
